<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folien Staunen über die Schöpfung</title>
<style>
  :root { --gold: #e0b24e; --ink: #f3f5fa; --mute: #9fb0cc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05080f; color: var(--ink); overflow: hidden; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  .stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); overflow: hidden; background: radial-gradient(ellipse at 30% 20%, #17294a, #0a1222 70%); }
  .slide { position: absolute; inset: 0; display: none; padding: 7% 9%; flex-direction: column; justify-content: center; }
  .slide.on { display: flex; animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .big h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: calc(var(--u) * 5.2); line-height: 1.15; margin: 0; max-width: 85%; }
  .big p { font-size: calc(var(--u) * 2.3); color: var(--mute); max-width: 75%; margin: calc(var(--u) * 2) 0 0; line-height: 1.4; }
  .big .tag, .list .tag, .timer .tag { font-size: calc(var(--u) * 1.3); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: calc(var(--u) * 1.5); }
  .list h1, .timer h1 { font-family: Georgia, serif; font-weight: 400; font-size: calc(var(--u) * 4.2); margin: 0 0 calc(var(--u) * 2.2); }
  .list ul { margin: 0; padding: 0; list-style: none; font-size: calc(var(--u) * 2.5); line-height: 1.5; }
  .list li { padding-left: calc(var(--u) * 2.4); position: relative; margin-bottom: calc(var(--u) * .9); }
  .list li::before { content: ""; position: absolute; left: 0; top: .65em; width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 50%; background: var(--gold); }
  .img { padding: 0; }
  .img .pic { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .img .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(3,6,12,.82) 0%, rgba(3,6,12,0) 45%); }
  .img h1 { position: absolute; left: 6%; right: 8%; bottom: 8%; margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: calc(var(--u) * 4); line-height: 1.2; text-shadow: 0 2px 20px rgba(0,0,0,.8); }
  .credit { position: absolute; right: 1.5%; bottom: 1%; font-size: calc(var(--u) * .95); color: rgba(255,255,255,.65); text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .missing { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); font-size: calc(var(--u) * 2); }
  .riddle .pic { transition: transform .9s ease, background-position .9s ease; }
  .riddle .answer { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; font-family: Georgia, serif; font-size: calc(var(--u) * 5); text-shadow: 0 2px 20px rgba(0,0,0,.9); opacity: 0; transition: opacity .6s; }
  .riddle .answer.show { opacity: 1; }
  .riddle .q { position: absolute; left: 0; right: 0; top: 8%; text-align: center; font-family: Georgia, serif; font-size: calc(var(--u) * 4.6); text-shadow: 0 2px 20px rgba(0,0,0,.9); }
  .est { align-items: center; text-align: center; }
  .est h1 { font-family: Georgia, serif; font-weight: 400; font-size: calc(var(--u) * 4.4); max-width: 88%; margin: 0; line-height: 1.2; }
  .est .a { margin-top: calc(var(--u) * 3); font-size: calc(var(--u) * 6); color: var(--gold); font-weight: 700; opacity: 0; transform: translateY(10px); transition: all .5s; }
  .est .a.show { opacity: 1; transform: none; }
  .timer { align-items: center; text-align: center; }
  .timer .clock { font-size: calc(var(--u) * 15); font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: .02em; }
  .timer .clock.done { color: var(--gold); }
  .timer p { font-size: calc(var(--u) * 2.2); color: var(--mute); margin: calc(var(--u) * 1) 0 0; }
  .timer .hint { font-size: calc(var(--u) * 1.4); margin-top: calc(var(--u) * 2.5); opacity: .7; }
  .ring { position: absolute; right: 3%; top: 4%; width: calc(var(--u) * 8); height: calc(var(--u) * 8); }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bg { stroke: rgba(255,255,255,.2); }
  .ring .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--u) * 2); font-weight: 700; }
  .ringmsg { position: absolute; right: 3%; top: calc(var(--u) * 9.5); font-size: calc(var(--u) * 1.5); color: var(--gold); text-align: right; max-width: 22%; }
  .bigstage .tag { display: block; }
  .bar { position: absolute; left: 0; bottom: 0; height: .5%; background: var(--gold); transition: width .3s; z-index: 5; }
  .meta { position: absolute; left: 1.5%; top: 1.5%; font-size: calc(var(--u) * 1.1); color: rgba(255,255,255,.5); z-index: 5; }
  .notes { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(5,8,15,.94); border-top: 2px solid var(--gold); padding: 1.6% 4%; font-size: calc(var(--u) * 1.7); color: #dbe4f5; display: none; z-index: 6; }
  .notes.on { display: block; }
  .notes b { color: var(--gold); letter-spacing: .1em; text-transform: uppercase; font-size: .75em; display: block; margin-bottom: .2em; }
  .black { position: absolute; inset: 0; background: #000; display: none; z-index: 9; }
  .black.on { display: block; }
  .help { position: absolute; right: 1.5%; top: 1.5%; font-size: calc(var(--u) * 1.1); color: rgba(255,255,255,.35); z-index: 5; }
  .overview { position: absolute; inset: 0; background: rgba(5,8,15,.97); z-index: 8; display: none; padding: 5%; overflow: auto; }
  .overview.on { display: block; }
  .overview h2 { font-family: Georgia, serif; font-weight: 400; margin: 0 0 1em; font-size: calc(var(--u) * 3); }
  .overview ol { margin: 0; padding-left: 1.4em; font-size: calc(var(--u) * 1.7); line-height: 1.7; }
  .overview li { cursor: pointer; }
  .overview li:hover { color: var(--gold); }
  .overview li.cur { color: var(--gold); font-weight: 700; }
  .nav { position: absolute; inset: 0; z-index: 4; display: grid; grid-template-columns: 28% 72%; }
  .nav div { cursor: pointer; }
  .agenda { margin-top: calc(var(--u) * 2.5); font-size: calc(var(--u) * 1.9); color: var(--ink); line-height: 1.7; }
  .agenda span { color: var(--mute); display: inline-block; width: calc(var(--u) * 8); }
  @media print { html, body { overflow: visible; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="meta" id="meta"></div>
  <div class="help">Pfeile: weiter, N: Hinweise, F: Vollbild, B: schwarz, O: Übersicht</div>
  <div id="slides"></div>
  <div class="nav" id="nav"><div id="prev"></div><div id="next"></div></div>
  <div class="notes" id="notes"></div>
  <div class="overview" id="overview"></div>
  <div class="black" id="black"></div>
  <div class="bar" id="bar"></div>
</div>

<script src="data.js"></script>
<script src="slides-data.js"></script>
<script>
(function () {
  "use strict";
  var METHODS = window.METHODS, PHASES = window.PHASES, SLIDES = window.SLIDES;
  var STORE = "schoepfung-weg-v1";
  var byId = {}; METHODS.forEach(function (m) { byId[m.id] = m; });
  var stage = document.getElementById("stage");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fit() { stage.style.setProperty("--u", (stage.clientWidth / 100) + "px"); }
  fit(); window.addEventListener("resize", fit);

  /* Weg bestimmen: Hash > localStorage > Standard */
  function parse(str) {
    var parts = String(str || "").split(",");
    if (parts.length !== PHASES.length) return null;
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var id = parts[i];
      if (id === "-" || id === "") { out.push(null); continue; }
      if (!byId[id] || byId[id].phase !== PHASES[i].id) return null;
      out.push(id);
    }
    return out;
  }
  var weg = null, hm = /weg=([^&]+)/.exec(location.hash || "");
  if (hm) weg = parse(decodeURIComponent(hm[1]));
  if (!weg) { try { weg = parse(localStorage.getItem(STORE)); } catch (e) { /* egal */ } }
  if (!weg) weg = (window.PRESETS[0].ids);
  var all = /alle/.test(location.hash || "");

  /* Folienliste aufbauen */
  var list = [];
  var methodIds = all ? METHODS.map(function (m) { return m.id; }) : weg.filter(Boolean);
  var total = methodIds.reduce(function (s, id) { return s + byId[id].min; }, 0);
  // Titelfolie mit Ablauf
  var t0 = 0;
  var agenda = methodIds.map(function (id) { var m = byId[id], s = '<div><span>' + t0 + " Min</span>" + esc(m.title) + "</div>"; t0 += m.min; return s; }).join("");
  list.push({ t: "title", agenda: agenda, total: total, label: "Start" });
  methodIds.forEach(function (id) {
    var m = byId[id];
    (SLIDES[id] || []).forEach(function (s, i) {
      var c = Object.assign({}, s); c.label = m.title; c.mid = id; c.first = i === 0; list.push(c);
    });
  });

  /* Bildnachweise */
  var credits = {};
  fetch("img/quellen.json").then(function (r) { return r.ok ? r.json() : []; }).then(function (arr) {
    arr.forEach(function (x) { credits[x.datei] = x.hinweisAufFolie || ""; });
    document.querySelectorAll("[data-credit]").forEach(function (n) { n.textContent = credits[n.getAttribute("data-credit")] || ""; });
  }).catch(function () { /* ohne Nachweis weiter */ });

  /* Rendern */
  var holder = document.getElementById("slides");
  var runtime = []; // pro Folie: {steps, onEnter, onLeave}
  list.forEach(function (s, idx) {
    var d = document.createElement("div");
    d.className = "slide " + (s.t === "big" || s.t === "title" ? "big" : s.t) + (s.t === "riddle" ? " img" : "");
    var rt = { steps: 0, step: 0, timers: [] };
    var h = "";
    if (s.t === "title") {
      d.className = "slide big";
      h = '<div class="tag">Religion, 8. Klasse</div><h1>Staunen über die Schöpfung</h1><p>' + s.total + ' Minuten' + (all ? ", alle Methoden" : ", dein Weg") + '</p><div class="agenda">' + s.agenda + "</div>";
    } else if (s.t === "big") {
      h = (s.first ? '<div class="tag">' + esc(s.label) + "</div>" : "") + "<h1>" + esc(s.h) + "</h1>" + (s.s ? "<p>" + esc(s.s) + "</p>" : "");
    } else if (s.t === "list") {
      h = '<div class="tag">' + esc(s.label) + "</div><h1>" + esc(s.h) + "</h1><ul>" + s.items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    } else if (s.t === "img") {
      d.className = "slide img";
      h = '<div class="pic" style="background-image:url(img/' + esc(s.src) + ')' + (s.fit === "contain" ? ";background-size:contain;background-repeat:no-repeat;background-color:#000" : "") + '"></div><div class="shade"></div>' +
        (s.h ? "<h1>" + esc(s.h) + "</h1>" : "") + '<div class="credit" data-credit="' + esc(s.src) + '"></div>';
    } else if (s.t === "riddle") {
      h = '<div class="pic" style="background-image:url(img/' + esc(s.src) + ');transform:scale(3.2);transform-origin:' + esc(s.pos) + '"></div><div class="shade"></div><div class="q">Was ist das?</div><div class="answer">' + esc(s.answer) + '</div><div class="credit" data-credit="' + esc(s.src) + '"></div>';
      rt.steps = 2;
    } else if (s.t === "est") {
      h = '<h1>' + esc(s.q) + '</h1><div class="a">' + esc(s.a) + "</div>";
      rt.steps = 1;
    } else if (s.t === "timer") {
      h = '<div class="tag">' + esc(s.label) + "</div><h1>" + esc(s.h) + '</h1><div class="clock" data-secs="' + s.secs + '">' + fmt(s.secs) + "</div><p>" + esc(s.sub || "") + '</p><div class="hint">Leertaste: Start oder Pause</div>';
    }
    if (s.silence) {
      h += '<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"></circle><circle class="fg" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"></circle></svg><div class="lbl">' + s.silence + '</div></div><div class="ringmsg"></div>';
    }
    d.innerHTML = h;
    var pic = d.querySelector(".pic");
    if (pic && s.src) {
      var im = new Image();
      im.onerror = function () { var m = document.createElement("div"); m.className = "missing"; m.textContent = "Bild fehlt: " + s.src; d.appendChild(m); };
      im.src = "img/" + s.src;
    }
    holder.appendChild(d);
    runtime.push(rt);
  });

  function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }

  /* Ablauf */
  var cur = 0, timerId = null, running = false, remaining = 0;
  var slideEls = holder.children;
  var metaEl = document.getElementById("meta"), barEl = document.getElementById("bar"), notesEl = document.getElementById("notes");

  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } running = false; }

  function show(i) {
    stopTimer();
    cur = Math.max(0, Math.min(list.length - 1, i));
    for (var k = 0; k < slideEls.length; k++) slideEls[k].classList.toggle("on", k === cur);
    var s = list[cur], rt = runtime[cur], d = slideEls[cur];
    rt.step = 0;
    metaEl.textContent = (cur + 1) + " / " + list.length + "   " + s.label;
    barEl.style.width = ((cur + 1) / list.length * 100) + "%";
    notesEl.innerHTML = s.note ? "<b>Hinweis für die Lehrkraft</b>" + esc(s.note) : "";
    if (s.t === "riddle") { var p = d.querySelector(".pic"); p.style.transform = "scale(3.2)"; d.querySelector(".answer").classList.remove("show"); }
    if (s.t === "est") d.querySelector(".a").classList.remove("show");
    if (s.t === "timer") { var c = d.querySelector(".clock"); remaining = s.secs; c.textContent = fmt(remaining); c.classList.remove("done"); }
    if (s.silence) startSilence(d, s.silence);
    try { history.replaceState(null, "", location.hash); } catch (e) { /* egal */ }
  }

  function startSilence(d, secs) {
    var fg = d.querySelector(".fg"), lbl = d.querySelector(".lbl"), msg = d.querySelector(".ringmsg"), left = secs, circ = 276.5;
    fg.style.transition = "none"; fg.style.strokeDashoffset = 0; lbl.textContent = left; msg.textContent = "Stille";
    setTimeout(function () { fg.style.transition = "stroke-dashoffset 1s linear"; }, 30);
    timerId = setInterval(function () {
      left--; lbl.textContent = Math.max(left, 0);
      fg.style.strokeDashoffset = circ * (1 - left / secs);
      if (left <= 0) { clearInterval(timerId); timerId = null; msg.textContent = list[cur].t === "img" ? "Schreibe ein Wort auf" : ""; }
    }, 1000);
  }

  function toggleTimer() {
    var s = list[cur];
    if (s.t !== "timer") return false;
    var c = slideEls[cur].querySelector(".clock");
    if (running) { stopTimer(); return true; }
    if (remaining <= 0) { remaining = s.secs; }
    running = true;
    timerId = setInterval(function () {
      remaining--; c.textContent = fmt(Math.max(remaining, 0));
      if (remaining <= 0) { stopTimer(); c.classList.add("done"); c.textContent = "Zeit"; }
    }, 1000);
    return true;
  }

  function next() {
    var rt = runtime[cur], s = list[cur], d = slideEls[cur];
    if (rt.steps && rt.step < rt.steps) {
      rt.step++;
      if (s.t === "riddle") {
        if (rt.step === 1) d.querySelector(".pic").style.transform = "scale(1)";
        if (rt.step === 2) d.querySelector(".answer").classList.add("show");
      }
      if (s.t === "est") d.querySelector(".a").classList.add("show");
      return;
    }
    if (cur < list.length - 1) show(cur + 1);
  }
  function prev() { if (cur > 0) show(cur - 1); }

  document.getElementById("next").addEventListener("click", next);
  document.getElementById("prev").addEventListener("click", prev);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown") { next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { prev(); e.preventDefault(); }
    else if (e.key === " ") { if (!toggleTimer()) next(); e.preventDefault(); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(list.length - 1);
    else if (e.key === "n" || e.key === "N") notesEl.classList.toggle("on");
    else if (e.key === "b" || e.key === "B") document.getElementById("black").classList.toggle("on");
    else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
    else if (e.key === "o" || e.key === "O") toggleOverview();
    else if (e.key === "Escape") { document.getElementById("overview").classList.remove("on"); }
  });
  var tx = null;
  document.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
  });

  function toggleOverview() {
    var ov = document.getElementById("overview");
    if (ov.classList.contains("on")) { ov.classList.remove("on"); return; }
    ov.innerHTML = "<h2>Übersicht</h2><ol>" + list.map(function (s, i) {
      var t = s.t === "title" ? "Titel" : (s.h || s.q || s.answer || s.src || s.label);
      return '<li data-i="' + i + '" class="' + (i === cur ? "cur" : "") + '">' + esc(s.label) + ": " + esc(t) + "</li>";
    }).join("") + "</ol>";
    ov.classList.add("on");
    ov.onclick = function (e) { var li = e.target.closest("li"); if (li) { ov.classList.remove("on"); show(+li.dataset.i); } };
  }

  show(0);
})();
</script>
</body>
</html>
