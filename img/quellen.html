<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bildquellen und Lizenzen</title>
<style>
  body { margin: 0; font: 16px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif; background: #f6f4ee; color: #1d2433; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-family: Georgia, serif; }
  a { color: #1f3a5f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .c { background: #fff; border: 1px solid #e1dccd; border-radius: 14px; overflow: hidden; }
  .c img { width: 100%; height: 160px; object-fit: cover; display: block; background: #ddd; }
  .c div { padding: 10px 14px 14px; font-size: .9rem; }
  .c b { display: block; margin-bottom: 3px; }
  .lic { color: #5b6577; }
  @media (prefers-color-scheme: dark) { body { background: #12161f; color: #e8ebf2; } .c { background: #1b2130; border-color: #2e3750; } a { color: #8fb0e0; } .lic { color: #9aa5ba; } }
</style></head><body><main>
<p><a href="../index.html">Zurück zum Baukasten</a></p>
<h1>Bildquellen und Lizenzen</h1>
<p>Alle Bilder in den Folien sind Public Domain oder frei lizenziert. Wo eine Namensnennung verlangt ist, steht sie klein auf der Folie. Diese Seite ist der vollständige Nachweis.</p>
<div class="grid" id="g"></div>
<script>
fetch("quellen.json").then(function (r) { return r.json(); }).then(function (arr) {
  var g = document.getElementById("g");
  arr.forEach(function (x) {
    var c = document.createElement("div"); c.className = "c";
    var img = document.createElement("img"); img.src = x.datei; img.alt = x.titel || x.datei; img.loading = "lazy";
    var d = document.createElement("div");
    var b = document.createElement("b"); b.textContent = x.titel || x.datei;
    var u = document.createElement("div"); u.className = "lic"; u.textContent = "Urheber: " + (x.urheber || "unbekannt") + " | Lizenz: " + (x.lizenz || "");
    var a = document.createElement("a"); a.href = x.quelleUrl; a.textContent = "Originalseite"; a.target = "_blank"; a.rel = "noopener";
    d.appendChild(b); d.appendChild(u); d.appendChild(a); c.appendChild(img); c.appendChild(d); g.appendChild(c);
  });
}).catch(function () { document.getElementById("g").textContent = "Nachweis konnte nicht geladen werden."; });
</script></main></body></html>
